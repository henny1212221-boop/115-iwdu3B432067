<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>聯絡我 | 黃敏茹</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <article class="profile-card">
        <!-- 頂部目錄導覽 -->
        <nav class="main-nav" aria-label="導覽列">
            <a href="index.html" class="nav-link">首頁</a>
            <a href="about.html" class="nav-link">自我介紹</a>
        </nav>

        <header>
            <h1 class="name" style="margin-bottom: 24px;">聯絡我</h1>
        </header>

        <!-- 聯絡表單 -->
        <main>
            <form action="#" method="POST" class="contact-form" novalidate>
                <fieldset class="form-fieldset">
                    <legend class="form-legend">聯絡表單</legend>

                    <!-- 欄位 1: 姓名 -->
                    <div class="form-group">
                        <label for="user-name" class="form-label">
                            姓名
                            <span class="required-star" aria-hidden="true">*</span>
                        </label>
                        <input 
                            type="text" 
                            id="user-name" 
                            name="user_name" 
                            class="form-control" 
                            placeholder="例如：王小明" 
                            required 
                            autocomplete="name"
                        >
                    </div>

                    <!-- 欄位 2: Email -->
                    <div class="form-group">
                        <label for="user-email" class="form-label">
                            電子郵件
                            <span class="required-star" aria-hidden="true">*</span>
                        </label>
                        <input 
                            type="email" 
                            id="user-email" 
                            name="user_email" 
                            class="form-control" 
                            placeholder="例如：name@example.com" 
                            required 
                            autocomplete="email"
                        >
                    </div>

                    <!-- 欄位 3: 留言內容 -->
                    <div class="form-group">
                        <label for="user-message" class="form-label">
                            留言內容
                            <span class="required-star" aria-hidden="true">*</span>
                        </label>
                        <textarea 
                            id="user-message" 
                            name="user_message" 
                            rows="4" 
                            class="form-control" 
                            placeholder="請輸入您想詢問或交流的事項..." 
                            required
                        ></textarea>
                    </div>

                    <button type="submit" class="btn-submit">送出訊息</button>
                </fieldset>
            </form>
        </main>

        <footer class="card-footer">
            <p>&copy; 2026 黃敏茹. All rights reserved.</p>
        </footer>
    </article>

</body>
</html>
